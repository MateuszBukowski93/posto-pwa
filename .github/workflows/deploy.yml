name: Build & deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, testy i build
    runs-on: ubuntu-latest
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Konfiguracja GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build PWA (statyczny eksport + service worker)
        run: npm run build -w @posto/pwa
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_APP_URL: ${{ steps.pages.outputs.base_url }}/
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}

      - name: Build landing page
        run: npm run build -w @posto/landing
        env:
          NEXT_PUBLIC_APP_URL: ${{ steps.pages.outputs.base_url }}/

      - name: Artefakt dla testów E2E
        uses: actions/upload-artifact@v7
        with:
          name: out
          path: apps/pwa/out
          include-hidden-files: true
          retention-days: 7

      - name: Artefakt GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/pwa/out

  e2e:
    name: Testy E2E (Playwright)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: out
          path: apps/pwa/out

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ needs.build.outputs.base_path }}

      - name: Raport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/pwa/playwright-report
          retention-days: 7

  deploy:
    name: Deploy na GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [build, e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
