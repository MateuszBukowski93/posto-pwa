<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Posto – waga i woda</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; overflow: hidden">
  <main style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 16px; box-sizing: border-box">
    <header style="display: flex; align-items: center; justify-content: space-between; min-height: 48px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1">Pomiary</h1>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.ink}}; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        <span>Dodaj wagę</span>
      </button>
    </header>

    <section aria-label="Waga" style="display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-radius: 20px; background: {{t.surface}}; border: 1px solid {{t.line}}">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; font-weight: 700; color: {{t.muted}}">Waga</span>
          <span style="font-family: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums">82,4 <span style="font-size: 20px; color: {{t.muted}}">kg</span></span>
        </div>
        <span style="padding: 6px 10px; border-radius: 999px; background: {{t.accentSoft}}; color: {{t.accentText}}; font-size: 13px; font-weight: 700">−2,1 kg w 30 dni</span>
      </div>
      <svg width="314" height="64" viewBox="0 0 314 64" aria-label="Trend wagi z 30 dni: spadek z 84,5 do 82,4 kg" role="img" style="display: block">
        <polyline points="{{spark.points}}" fill="none" stroke="{{t.accent}}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
        <circle cx="{{spark.lx}}" cy="{{spark.ly}}" r="5" fill="{{t.surface}}" stroke="{{t.accent}}" stroke-width="2.5"></circle>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: {{t.muted}}">
          <span>Start 84,5 kg</span>
          <span>Cel 78 kg</span>
        </div>
        <div style="height: 6px; border-radius: 3px; background: {{t.track}}; overflow: hidden">
          <div style="width: 32%; height: 6px; border-radius: 3px; background: {{t.ink}}"></div>
        </div>
      </div>
    </section>

    <section aria-label="Woda" style="display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 20px; background: {{t.waterSoft}}">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-size: 13px; font-weight: 700; color: {{t.waterText}}">Woda dziś</span>
        <span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">{{waterLabel}} <span style="font-weight: 500; color: {{t.muted}}">/ 2,5 l</span></span>
      </div>
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="10">
          <div style="height: 36px; border-radius: 8px; background: {{c.bg}}"></div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" onClick="{{removeWater}}" aria-label="Usuń 250 ml wody" style="width: 48px; min-height: 48px; border-radius: 14px; border: 1px solid {{t.water}}; background: transparent; color: {{t.waterText}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
        </button>
        <button type="button" onClick="{{addWater}}" style="flex: 1 1 auto; min-height: 48px; border-radius: 14px; border: none; background: {{t.waterBtn}}; color: #ffffff; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">+ 250 ml</button>
      </div>
    </section>

    <section aria-label="Ostatnie pomiary wagi" style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 700; color: {{t.muted}}; letter-spacing: 0.04em; text-transform: uppercase">Ostatnie pomiary</span>
      <div style="display: flex; flex-direction: column; border-radius: 18px; background: {{t.surface}}; border: 1px solid {{t.line}}; overflow: hidden">
        <sc-for list="{{log}}" as="l" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-top: 1px solid {{l.divider}}">
            <span style="font-size: 14px; font-weight: 600">{{l.date}}</span>
            <div style="display: flex; align-items: baseline; gap: 10px">
              <span style="font-size: 12px; color: {{t.muted}}; font-variant-numeric: tabular-nums">{{l.diff}}</span>
              <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{l.kg}}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </section>
  </main>

  <nav aria-label="Nawigacja główna" style="flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 18px; background: {{t.surface}}; border-top: 1px solid {{t.line}}">
    <a href="{{nav.timer}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: {{t.muted}}; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"></circle><path d="M12 10v3.5l2.5 2M9.5 3h5"></path></svg>
      <span>Timer</span>
    </a>
    <a href="{{nav.historia}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: {{t.muted}}; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
      <span>Historia</span>
    </a>
    <a href="{{nav.pomiary}}" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: {{t.accentText}}; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5h16M5.5 15l4-5 3.5 3 5.5-7"></path></svg>
      <span>Pomiary</span>
    </a>
    <a href="{{nav.ustawienia}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: {{t.muted}}; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h2M11 17h9"></path><circle cx="15.5" cy="7" r="2.5"></circle><circle cx="8.5" cy="17" r="2.5"></circle></svg>
      <span>Ustawienia</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Motyw"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { water: 5 };
  }
  theme(dark) {
    return dark
      ? { bg: '#0E1311', surface: '#171E1B', line: '#26302C', track: '#232C28', ink: '#EDF1EE', muted: '#9BA7A1', accent: '#F0784C', accentText: '#F5916B', accentSoft: '#33221A', water: '#3D8FD1', waterBtn: '#2F7FC1', waterText: '#7DB8EA', waterSoft: '#14273A', waterEmpty: '#1F3a52', btn: '#EDF1EE', btnText: '#0E1311' }
      : { bg: '#F2F4F1', surface: '#FFFFFF', line: '#DCE2DD', track: '#E3E8E4', ink: '#141B18', muted: '#56615B', accent: '#E8673A', accentText: '#B0441C', accentSoft: '#FBE4DA', water: '#2F7FC1', waterBtn: '#226BA8', waterText: '#1F5F96', waterSoft: '#DDEBF7', waterEmpty: '#C2DAEE', btn: '#141B18', btnText: '#FFFFFF' };
  }
  renderVals() {
    const dark = !!this.props.dark;
    const t = this.theme(dark);
    const s = dark ? 'Dark' : '';
    const w = [84.5, 84.6, 84.3, 84.4, 84.1, 84.2, 83.9, 84.0, 83.8, 83.9, 83.6, 83.7, 83.5, 83.6, 83.3, 83.4, 83.2, 83.3, 83.1, 83.0, 83.1, 82.9, 82.8, 82.9, 82.7, 82.8, 82.6, 82.7, 82.7, 82.4];
    const max = 84.8, min = 82.1;
    const pts = w.map((v, i) => {
      const x = 6 + (i * (314 - 12)) / (w.length - 1);
      const y = 6 + ((max - v) / (max - min)) * (64 - 12);
      return [x.toFixed(1), y.toFixed(1)];
    });
    const last = pts[pts.length - 1];
    const water = this.state.water;
    const log = [
      { date: 'Dziś, 7:10', kg: '82,4 kg', diff: '−0,3' },
      { date: 'Wczoraj, 7:05', kg: '82,7 kg', diff: '0,0' },
      { date: 'Sobota, 7:30', kg: '82,7 kg', diff: '+0,1' }
    ].map((l, i) => ({ ...l, divider: i === 0 ? 'transparent' : t.line }));
    return {
      t,
      spark: { points: pts.map((p) => p.join(',')).join(' '), lx: last[0], ly: last[1] },
      waterLabel: String(water * 0.25).replace('.', ',') + ' l',
      cells: Array.from({ length: 10 }, (_, i) => ({ bg: i < water ? t.water : t.waterEmpty })),
      addWater: () => this.setState((st) => ({ water: Math.min(st.water + 1, 20) })),
      removeWater: () => this.setState((st) => ({ water: Math.max(st.water - 1, 0) })),
      log,
      nav: {
        timer: dark ? 'TimerDark.dc.html' : 'Main.dc.html',
        historia: 'Historia' + s + '.dc.html',
        pomiary: 'Pomiary' + s + '.dc.html',
        ustawienia: 'Ustawienia' + s + '.dc.html'
      }
    };
  }
}
</script>
</body>
</html>
